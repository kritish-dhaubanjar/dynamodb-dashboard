<template>
  <style>
    #root { position: absolute; inset: 0; background: #f2f3f3; overflow: hidden; font-family: "Roboto", sans-serif; }
    .s4-cam { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; }
    .s4-cam img { display: block; width: 1600px; height: 1000px; }
    .s4-label { position: absolute; left: 192px; bottom: 108px; display: flex; align-items: center; gap: 18px; background: #ffffff; border: 1px solid #e3e3e3; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); padding: 16px 28px 16px 22px; font-size: 36px; font-weight: 500; color: #212529; line-height: 1.2; }
    .s4-label i { display: block; width: 8px; height: 38px; background: #7393f7; }
  </style>
  <div id="root" data-composition-id="s4" data-width="1920" data-height="1080">
    <div id="s4-cam-create" class="s4-cam" data-layout-allow-overflow><img src="assets/img/create-table.png" alt="Create table screen" /></div>
    <div id="s4-cam-ttl" class="s4-cam" data-layout-allow-overflow><img src="assets/img/ttl-sessions.png" alt="Time to Live screen" /></div>
    <div id="s4-cam-streams" class="s4-cam" data-layout-allow-overflow><img src="assets/img/streams-sessions.png" alt="Streams screen" /></div>
    <div id="s4-cam-edit" class="s4-cam" data-layout-allow-overflow><img src="assets/img/edit-item.png" alt="Edit item screen with the JSON editor" /></div>
    <div id="s4-label-create" class="s4-label"><i></i><span>Create table</span></div>
    <div id="s4-label-ttl" class="s4-label"><i></i><span>TTL</span></div>
    <div id="s4-label-streams" class="s4-label"><i></i><span>Streams</span></div>
    <div id="s4-label-edit" class="s4-label"><i></i><span>Edit items as JSON</span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // beat-grid (vol-12, every other beat): cuts at local 0, 1.09, 2.18, 3.27 (abs 13.11, 14.20, 15.29, 16.38)
    const shots = [
      { cam: "#s4-cam-create", label: "#s4-label-create", at: 0, s: 1.6, x: 128, y: -100 },
      { cam: "#s4-cam-ttl", label: "#s4-label-ttl", at: 1.09, s: 1.7, x: 144, y: 115 },
      { cam: "#s4-cam-streams", label: "#s4-label-streams", at: 2.18, s: 1.7, x: 144, y: 115 },
      { cam: "#s4-cam-edit", label: "#s4-label-edit", at: 3.27, s: 1.65, x: 86, y: -120 },
    ];
    shots.forEach((sh, i) => {
      const prev = shots[i - 1];
      // earliest tween per target is the "show" (from hidden): it sets the resting state at authoring time
      tl.fromTo(sh.cam, { opacity: 0 }, { opacity: 1, duration: 0.02 }, sh.at);
      tl.fromTo(sh.label, { opacity: 0 }, { opacity: 1, duration: 0.02 }, sh.at);
      if (prev) {
        tl.fromTo(prev.cam, { opacity: 1 }, { opacity: 0, duration: 0.02, immediateRender: false }, sh.at);
        tl.fromTo(prev.label, { opacity: 1 }, { opacity: 0, duration: 0.02, immediateRender: false }, sh.at);
      }
      // each screen comes in slightly large and settles
      tl.fromTo(sh.cam, { scale: sh.s * 1.035, x: sh.x - 30, y: sh.y - 18 }, { scale: sh.s, x: sh.x, y: sh.y, duration: 0.45, ease: "power3.out", immediateRender: false }, sh.at);
      tl.fromTo(sh.label + " span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, sh.at + 0.05);
    });
    // fade under the end card
    tl.fromTo("#root", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.in" }, 5.45);
    window.__timelines["s4"] = tl;
  </script>
</template>
