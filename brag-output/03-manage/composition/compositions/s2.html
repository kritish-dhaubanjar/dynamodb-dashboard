  <script>
    const tl = gsap.timeline({ paused: true });
    // beat-locked cuts (vol-9): local 0, 2.64, 5.26, 7.37, 10.0, 12.63 = abs 5.28, 7.92, 10.54, 12.65, 15.28, 17.91
    const shots = [
      { cam: "#s2-cam-idx", label: "#s2-label-idx", at: 0, s: 1.5, x: 60, y: 165 },
      { cam: "#s2-cam-ttl", label: "#s2-label-ttl", at: 2.64, s: 1.7, x: 144, y: 115 },
      { cam: "#s2-cam-streams", label: "#s2-label-streams", at: 5.26, s: 1.7, x: 144, y: 115 },
      { cam: "#s2-cam-schema", label: "#s2-label-schema", at: 7.37, s: 1.6, x: 128, y: -100 },
      { cam: "#s2-cam-copy", label: "#s2-label-copy", at: 10.0, s: 1.5, x: -615, y: -105 },
      { cam: "#s2-cam-url", label: "#s2-label-url", at: 12.63, s: 1.3, x: -2, y: 20 },
    ];
    shots.forEach((sh, i) => {
      const prev = shots[i - 1];
      // earliest tween per target is the "show" from hidden: it sets the resting state at authoring time
      tl.fromTo(sh.cam, { opacity: 0 }, { opacity: 1, duration: 0.02 }, sh.at);
      tl.fromTo(sh.label, { opacity: 0 }, { opacity: 1, duration: 0.02 }, sh.at);
      if (prev) {
        tl.fromTo(prev.cam, { opacity: 1 }, { opacity: 0, duration: 0.02, immediateRender: false }, sh.at);
        tl.fromTo(prev.label, { opacity: 1 }, { opacity: 0, duration: 0.02, immediateRender: false }, sh.at);
      }
      // each screen arrives slightly large and settles
      tl.fromTo(sh.cam, { scale: sh.s * 1.035, x: sh.x - 30, y: sh.y - 18 }, { scale: sh.s, x: sh.x, y: sh.y, duration: 0.45, ease: "power3.out", immediateRender: false }, sh.at);
      tl.fromTo(sh.label + " span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, sh.at + 0.05);
    });
    // the address chip slides into place over the scan screen
    tl.fromTo("#s2-url", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 12.93);
    // the cursor comes in, clicks into the address bar and the URL is selected (abs 18.88 to 19.65)
    tl.fromTo("#s2-cursor", { x: 1900, y: 1120, opacity: 0 }, { x: 1900, y: 1120, opacity: 1, duration: 0.01 }, 13.6);
    tl.fromTo("#s2-cursor", { x: 1900, y: 1120 }, { x: 1610, y: 150, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 13.61);
    tl.fromTo("#s2-cursor", { scale: 1 }, { scale: 0.86, duration: 0.07, ease: "power2.in", immediateRender: false }, 14.3);
    tl.fromTo("#s2-cursor", { scale: 0.86 }, { scale: 1, duration: 0.09, ease: "power2.out", immediateRender: false }, 14.37);
    tl.fromTo("#s2-url-sel", { backgroundColor: "rgba(115, 147, 247, 0)" }, { backgroundColor: "rgba(115, 147, 247, 0.28)", duration: 0.12, ease: "power2.out" }, 14.37);
    // fade under the end card
    tl.fromTo("#root", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in" }, 16.31);
    window.__timelines["s2"] = tl;
  </script>
